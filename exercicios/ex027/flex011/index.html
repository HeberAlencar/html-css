<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner { /* config do pai */
            background-color: salmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item { /*config do filho */
            background-color: lightsteelblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }

        div#cxA {
            flex-shrink: 0;
            flex-grow: 0;
        }

         div#cxB {
            flex-shrink: 0;
            flex-grow: 0;
        }

         div#cxC {
            flex-shrink: 0;
            flex-grow: 0;
        }

    </style>
    
</head>
<body>
    <div class="conteiner"><!-- Pai -->
        <div class="item" id="cxA">A</div> <!-- DA LETRA A ATÉ O G SÃO FILHOS-->
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>

    </div>
</body>
</html>
