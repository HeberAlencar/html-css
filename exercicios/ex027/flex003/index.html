<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner { /* config do pai */
            background-color: salmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item { /*config do filho */
            background-color: lightsteelblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }

    </style>
    
</head>
<body>
    <div class="conteiner"><!-- Pai -->
        <div class="item">Exemplo de bloco A</div> <!-- DA LETRA A ATÉ O G SÃO FILHOS-->
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>
</body>
</html>
